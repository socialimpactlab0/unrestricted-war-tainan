name: Install Meta Pixel tracking

on:
  push:
    paths:
      - '.github/workflows/add-meta-pixel.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Meta Pixel and registration events
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          pixel_id = '786478200392875'

          pixel_script = '''  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '786478200392875');
    fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel Code -->'''

          pixel_noscript = '''  <!-- Meta Pixel Code (noscript) -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=786478200392875&ev=PageView&noscript=1"
    alt="" /></noscript>'''

          if pixel_id not in html:
              html = html.replace('  <style>', pixel_script + '\n\n  <style>', 1)
              html = html.replace('<body>', '<body>\n' + pixel_noscript, 1)

          tracking_code = '''
    let hasTrackedRegistrationStart = false;

    function trackMetaEvent(eventName, parameters) {
      if (typeof window.fbq !== "function") return;
      window.fbq("trackCustom", eventName, parameters || {});
    }

    document.addEventListener("click", function(event) {
      const bookingLink = event.target.closest('a[href="#booking"]');
      if (!bookingLink) return;

      trackMetaEvent("ClickBooking", {
        content_name: "超限戰0815台南公益特映"
      });
    });

    bookingForm.addEventListener("input", function() {
      if (hasTrackedRegistrationStart) return;
      hasTrackedRegistrationStart = true;

      trackMetaEvent("StartRegistration", {
        content_name: "超限戰0815台南公益特映"
      });
    });
'''

          declaration_marker = '    const submitBtn = document.getElementById("submitBtn");\n'
          if 'hasTrackedRegistrationStart' not in html:
              if declaration_marker not in html:
                  raise SystemExit('Could not find submitBtn declaration marker')
              html = html.replace(declaration_marker, declaration_marker + tracking_code, 1)

          success_line = '        showMessage("success", "已收到您的訂票資料，訂票編號：" + result.bookingId + "。我們將於活動前與您確認。");\n'
          complete_event = '''        if (typeof window.fbq === "function") {
          window.fbq("track", "CompleteRegistration", {
            content_name: "超限戰0815台南公益特映",
            status: "completed",
            value: payload.totalAmount,
            currency: "TWD",
            num_items: payload.ticketQty
          });
        }
'''

          if 'window.fbq("track", "CompleteRegistration"' not in html:
              if success_line not in html:
                  raise SystemExit('Could not find booking success marker')
              html = html.replace(success_line, success_line + complete_event, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated index.html
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Meta Pixel and registration tracking"
          git push
